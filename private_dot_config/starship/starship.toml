# ~/.config/starship/starship.toml

# --- Основные настройки ---
# Формат вывода: верхняя строка с инфой, нижняя — для ввода команд
format = """
$os\
$directory\
$git_branch\
$git_status\
$docker_context\
$python\
$golang\
$nodejs\
$cmd_duration\
$line_break\
$character"""

# Не добавлять пустую строку перед промптом
add_newline = false

# --- Символ ввода команды ---
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# --- Иконка ОС ---
[os]
disabled = false
style = "bold blue"

[os.symbols]
Windows = " "
Ubuntu = " "
Debian = " "
Arch = "󰣇 "
Linux = " "

# --- Рабочая директория ---
[directory]
style = "bold cyan"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

# --- Git ветка ---
[git_branch]
symbol = " "
style = "bold magenta"
format = "on [$symbol$branch]($style) "

# --- Git статус ---
[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# --- Время выполнения долгих команд ---
[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

# --- Контекст Docker ---
[docker_context]
symbol = " "
style = "blue bold"
format = "via [$symbol$context]($style) "

# --- Python ---
[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol($version )(\\($virtualenv\\))]($style) "

# --- Golang ---
[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version)]($style) "

# --- Node.js ---
[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "

# --- Дополнительные модули ---
# Время
[time]
disabled = false
format = "[ $time ]($style)"
time_format = "%H:%M:%S"
style = "bold white"

# Пользователь
[username]
disabled = false
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style) "
show_always = true

# Хост
[hostname]
disabled = false
ssh_only = false
format = "[$hostname]($style) "
style = "bold white"
trim_at = ".local"
