# ~/.config/alacritty/alacritty.windows.yml
# Конфигурация для Windows (через Scoop)

# --- Окно ---
window:
  opacity: 0.90
  dimensions:
    columns: 120
    lines: 30
  padding:
    x: 10
    y: 10
  position:
    x: 0
    y: 0
  dynamic_padding: true
  decorations: full
  startup_mode: Windowed
  title: Alacritty
  dynamic_title: true

# --- Скаллинг ---
scrolling:
  history: 10000
  multiplier: 3

# --- Шрифт ---
font:
  normal:
    family: "Hasklug Nerd Font"
    style: Regular
  bold:
    family: "Hasklug Nerd Font"
    style: Bold
  italic:
    family: "Hasklug Nerd Font"
    style: Italic
  bold_italic:
    family: "Hasklug Nerd Font"
    style: Bold Italic
  size: 11.0
  offset:
    x: 0
    y: 0
  glyph_offset:
    x: 0
    y: 0

# --- Схема цветов (Tokyo Night Dark) ---
colors:
  primary:
    background: '#1a1b26'
    foreground: '#c0caf5'
  normal:
    black:   '#15161e'
    red:     '#f7768e'
    green:   '#9ece6a'
    yellow:  '#e0af68'
    blue:    '#7aa2f7'
    magenta: '#bb9af7'
    cyan:    '#7dcfff'
    white:   '#a9b1d6'
  bright:
    black:   '#414868'
    red:     '#f7768e'
    green:   '#9ece6a'
    yellow:  '#e0af68'
    blue:    '#7aa2f7'
    magenta: '#bb9af7'
    cyan:    '#7dcfff'
    white:   '#c0caf5'
  indexed_colors:
    - { index: 16, color: '#ff9e64' }
    - { index: 17, color: '#db4b4b' }
  selection:
    text: '#c0caf5'
    background: '#364a82'
  normal:
    text: '#c0caf5'
    background: '#1a1b26'
  search:
    matches:
      background: '#3b4261'
    focused_match:
      background: '#bb9af7'
  cursor:
    text: '#1a1b26'
    cursor: '#c0caf5'
  vi_mode_cursor:
    text: '#1a1b26'
    cursor: '#bb9af7'
  hints:
    start:
      foreground: '#1a1b26'
      background: '#e0af68'
    end:
      foreground: '#1a1b26'
      background: '#e0af68'

# --- Настройки курсора ---
cursor:
  style:
    shape: Block
    blinking: Off
  blink_interval: 750
  blink_timeout: 5
  unfocused_hollow: true

# --- Настройки терминала ---
terminal:
  osc_foreground_color: true
  shell_integration:
    enabled: true
    title: true
    current_directory: true
    prompt: true

# --- Звуки и уведомления ---
bell:
  command: none
  visual_animation: true

# --- Комбинации клавиш ---
key_bindings:
  - { key: KeyC, mods: Control, action: Copy }
  - { key: KeyV, mods: Control, action: Paste }
  - { key: Plus, mods: Control, action: IncreaseFontSize }
  - { key: Plus, mods: Control|Shift, action: IncreaseFontSize }
  - { key: KeyEquals, mods: Control, action: IncreaseFontSize }
  - { key: Minus, mods: Control, action: DecreaseFontSize }
  - { key: Minus, mods: Control|Shift, action: DecreaseFontSize }
  - { key: Key0, mods: Control, action: ResetFontSize }
  - { key: KeyF, mods: Control|Shift, action: ToggleFullscreen }
  - { key: PageUp, mods: Shift, action: ScrollPageUp }
  - { key: PageDown, mods: Shift, action: ScrollPageDown }
  - { key: KeyF, mods: Control|Shift, action: Search }

# --- Настройки для мыши ---
mouse:
  hide_when_typing: true
  bindings:
    - { mouse: Right, action: ExpandSelection }
    - { mouse: Middle, action: PasteSelection }

# --- Оболочка для Windows (PowerShell Core) ---
shell:
  program: "{{ .chezmoi.homeDir }}\\scoop\\apps\\pwsh\\current\\pwsh.exe"
  args:
    - "--nologo"
    - "-NoExit"
    - "-Command"
    - "Write-Host 'Welcome to PowerShell Core' -ForegroundColor Cyan"

# Рабочая директория при запуске
working_directory: None
